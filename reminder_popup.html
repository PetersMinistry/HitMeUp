<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HitMeUp Reminder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ink: #17212f;
      --muted: #5c6f82;
      --panel: #ffffff;
      --line: #d8e1ea;
      --page: #eef3f7;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green-bg: #dcfce7;
      --green: #166534;
      --red-bg: #fee2e2;
      --red: #991b1b;
      --shadow: 0 10px 24px rgba(23, 33, 47, 0.12);
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      min-width: 360px;
      max-width: 420px;
      max-height: 580px;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      overflow: hidden;
    }

    .shell {
      padding: 16px;
    }

    .hero {
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #ffffff 0%, #edf7ff 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(23, 33, 47, 0.08);
    }

    .mascot {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(23, 33, 47, 0.18));
    }

    h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
    }

    .tagline {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      margin: 12px 0 0;
      padding: 18px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.4;
      text-align: center;
    }

    .reminder-list {
      display: grid;
      gap: 12px;
      max-height: 410px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .view-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      padding: 4px;
      background: #dfe8f1;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(23, 33, 47, 0.04);
    }

    .view-switch button {
      min-height: 32px;
      padding: 7px 8px;
      border-color: transparent;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
    }

    .view-switch button.selected {
      color: var(--ink);
      border-color: var(--panel);
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(23, 33, 47, 0.12);
    }

    .view-switch button.selected:first-child {
      color: var(--red);
    }

    .view-switch button.selected:last-child {
      color: var(--blue-dark);
    }

    .section-title {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    .section {
      display: grid;
      gap: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .section-head .section-title {
      margin: 0;
    }

    .filter-row {
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .search-input,
    .filter-select {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      color: var(--ink);
      border: 1px solid #b5c4d3;
      border-radius: 6px;
      background: var(--panel);
      font: inherit;
    }

    .search-input:focus,
    .filter-select:focus {
      border-color: var(--blue);
      outline: 2px solid rgba(37, 99, 235, 0.18);
    }

    .filter-empty {
      margin: 0;
      padding: 12px;
      color: var(--muted);
      border: 1px dashed #b5c4d3;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .subtle-action {
      width: auto;
      min-height: 28px;
      padding: 5px 8px;
      color: var(--red);
      border-color: #f3b8b8;
      background: #fff7f7;
      font-size: 12px;
    }

    .subtle-action:hover {
      color: #ffffff;
      border-color: var(--red);
      background: var(--red);
    }

    .reminder {
      padding: 13px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(23, 33, 47, 0.08);
    }

    .reminder.due-card {
      position: relative;
      border-color: #f5b5b5;
      box-shadow: var(--shadow);
    }

    .reminder.due-card::before {
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 0;
      width: 4px;
      content: "";
      background: var(--red);
      border-radius: 0 4px 4px 0;
    }

    .reminder.due-card .status.due {
      animation: duePulse 1800ms ease-in-out infinite;
    }

    @keyframes duePulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(153, 27, 27, 0);
      }

      50% {
        box-shadow: 0 0 0 4px rgba(153, 27, 27, 0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reminder.due-card .status.due {
        animation: none;
      }
    }

    .reminder.compact {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px;
      box-shadow: none;
    }

    .reminder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      padding: 3px 8px;
      color: var(--green);
      background: var(--green-bg);
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.due {
      color: var(--red);
      background: var(--red-bg);
    }

    .subject {
      font-weight: bold;
      font-size: 16px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .reminder.compact .subject {
      font-size: 14px;
    }

    .time {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .compact-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .exact-time {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }

    .account-pill {
      display: inline-block;
      max-width: 160px;
      padding: 3px 7px;
      overflow: hidden;
      color: #24505f;
      background: #e0f2fe;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .due-account {
      margin-top: 7px;
    }

    .compact-action {
      min-width: 70px;
      width: auto;
      min-height: 30px;
      padding: 6px 9px;
      font-size: 13px;
    }

    .compact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .snooze-control {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding-top: 2px;
    }

    .snooze-select,
    .custom-snooze {
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      color: var(--ink);
      border: 1px solid #b5c4d3;
      border-radius: 6px;
      background: var(--panel);
      font: inherit;
    }

    .snooze-select:focus,
    .custom-snooze:focus {
      border-color: var(--blue);
      outline: 2px solid rgba(37, 99, 235, 0.18);
    }

    .custom-snooze {
      grid-column: 1 / -1;
    }

    .snooze-control button {
      width: auto;
      min-width: 96px;
    }

    button {
      min-height: 34px;
      padding: 8px 10px;
      width: 100%;
      cursor: pointer;
      border: 1px solid #b5c4d3;
      border-radius: 6px;
      color: var(--ink);
      background: var(--panel);
      font: inherit;
      font-weight: 600;
    }

    button:hover {
      border-color: var(--blue);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.14);
    }

    button.primary {
      color: #ffffff;
      border-color: var(--blue);
      background: var(--blue);
    }

    button.primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    button.danger {
      color: var(--red);
      border-color: #f3b8b8;
      background: #fff7f7;
    }

    button.danger:hover {
      color: #ffffff;
      border-color: var(--red);
      background: var(--red);
      box-shadow: 0 2px 8px rgba(153, 27, 27, 0.16);
    }

    .icon-button {
      width: auto;
      min-height: 34px;
      padding: 7px 9px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<main class="shell">
  <header class="hero">
    <img class="mascot" src="icons/icon-128.png" alt="">
    <div>
      <h2>HitMeUp Reminder</h2>
      <p class="tagline">Keep follow-ups moving without losing the thread.</p>
    </div>
    <button class="icon-button" id="settings-button" type="button">Options</button>
  </header>

  <div class="view-switch" id="view-switch" hidden>
    <button id="due-view-button" type="button">Due</button>
    <button id="active-view-button" type="button">Active</button>
  </div>

  <div class="reminder-list" id="reminders">
    <div id="due-group" hidden>
      <div class="section-head">
        <div class="section-title">Due Now</div>
        <button class="subtle-action" id="dismiss-all-due-button" type="button">Dismiss all</button>
      </div>
      <div class="section" id="due-reminders"></div>
    </div>

    <div id="upcoming-group" hidden>
      <div class="section-title">Active</div>
      <div class="filter-row">
        <input class="search-input" id="active-search" type="search" placeholder="Search active reminders">
        <select class="filter-select" id="account-filter" aria-label="Filter active reminders by account">
          <option value="">All accounts</option>
        </select>
      </div>
      <div class="section" id="upcoming-reminders"></div>
      <p class="filter-empty" id="active-filter-empty" hidden>No active reminders match.</p>
    </div>
  </div>
  <p class="empty" id="empty">No reminders set.</p>
</main>

<script src="reminder.js"></script>

</body>
</html>
